# vim:ft=kitty

## name: VS Light
## author: Samuele Panzeri
## license: MIT
## Visual Studio 2026 default Light theme — near-white editor canvas with the
## classic VS classification colours. Pairs with lua/vs.lua's light palette;
## nvim runs transparent, so this background IS the editor background.

#: The basic colors

foreground #000000
background #ffffff
selection_foreground #000000
selection_background #add6ff

#: Cursor colors

cursor #0078d4
cursor_text_color #ffffff

#: URL underline color when hovering with mouse

url_color #0078d4

#: Tab bar colors

tab_bar_background #f0f0f0
active_tab_foreground #000000
active_tab_background #ffffff
inactive_tab_foreground #6e6e6e
inactive_tab_background #e8e8e8

#: The basic 16 colors
#: Bright variants go *darker*, not lighter — on a white canvas the usual
#: brightening makes them vanish.

#: black
color0 #000000
color8 #808080

#: red
color1 #cd3131
color9 #a31515

#: green
color2 #008000
color10 #107c10

#: yellow
color3 #795e26
color11 #9b6e02

#: blue
color4 #0000ff
color12 #0078d4

#: magenta
color5 #8f08c4
color13 #6f42c1

#: cyan
color6 #2b91af
color14 #1b7c83

#: white
#: "White" has to be a mid grey here or anything printed in it is invisible.
color7 #6e7781
color15 #8c959f
